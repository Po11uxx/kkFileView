name: kkFileView Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run stable automated test suite
        run: >
          mvn -B -pl server
          -Dtest=cn.keking.utils.WebUtilsTests,cn.keking.utils.WebUtilsStructuralTests,cn.keking.utils.KkFileUtilsStructuralTests,cn.keking.utils.UrlEncoderUtilsStructuralTests
          test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: server/target/surefire-reports/*
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build package with Maven
        run: mvn -B -pl server -DskipTests package

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kkfileview-package
          path: |
            server/target/*.jar
            server/target/*.zip
            server/target/*.tar.gz
          if-no-files-found: ignore
          retention-days: 7
