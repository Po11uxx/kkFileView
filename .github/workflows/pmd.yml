name: PMD Static Analysis

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pmd:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run PMD analysis
        run: >
          mvn -B -pl server -DskipTests
          org.apache.maven.plugins:maven-pmd-plugin:3.26.0:pmd

      - name: Summarize PMD findings
        shell: bash
        run: |
          report="server/target/pmd.xml"
          if [ ! -f "$report" ]; then
            echo "PMD report not found: $report"
            exit 1
          fi

          total=$(grep -c '<violation' "$report" || true)
          files=$(grep -c '<file name=' "$report" || true)

          {
            echo "## PMD Result Overview"
            echo "- Total findings: ${total}"
            echo "- Files with findings: ${files}"
            echo "- Report path: ${report}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PMD report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: server/target/pmd.xml
          if-no-files-found: error
          retention-days: 7
